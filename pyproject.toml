[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowcalendar"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["PySide6-Essentials>=6.7", "keyring>=25.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
